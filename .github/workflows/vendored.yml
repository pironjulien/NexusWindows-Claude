# Written by the export step (nexus-publish). The shared modules listed in vendored.sha256 are embedded from the
# author's private shared folder (nexus-shared at bc6cf91) and must stay byte-identical to that version: change them
# upstream, never here.
name: Vendored modules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: sha256sum -c vendored.sha256
        run: sha256sum --strict -c vendored.sha256
