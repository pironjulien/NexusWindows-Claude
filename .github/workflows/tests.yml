name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: test.ps1 (unit tests, ruff; offline)
        shell: pwsh
        run: ./test.ps1

  startup-linux:
    # What MCP directories (Glama) check in a Linux container: the server starts and lists its tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: initialize + tools/list over stdio
        run: |
          uv sync --frozen --quiet
          uv run --frozen pytest -q --noconftest tests/test_startup.py
