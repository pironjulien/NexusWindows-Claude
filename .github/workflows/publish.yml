name: Publish to PyPI

# Trusted Publishing (OIDC): no token stored in the repository. PyPI side, once: a trusted publisher for this
# repository, workflow publish.yml, environment pypi; then set the repository variable PYPI_PUBLISH to true. From then
# on, a published GitHub release vX.Y.Z uploads that version (before that, releases only build and check), then
# publishes server.json to the official MCP registry (GitHub OIDC login, namespace io.github.pironjulien).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false  # a release build never reuses a cache another run could have written
      - name: Version matches the release tag, README carries the MCP registry name
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "pyproject version: $version"
          if [ "$EVENT_NAME" = "release" ] && [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match v$version"; exit 1
          fi
          grep -q 'mcp-name: io.github.pironjulien/nexus-windows-claude' README.md
          grep -q "nexus-windows-claude==$version" legacy/nexus-windows/pyproject.toml
      - run: uv build
      # Former PyPI name nexus-windows: a package that only installs nexus-windows-claude at the same version.
      - run: uv build legacy/nexus-windows --out-dir dist
      - name: Startup check from the built wheel
        run: |
          uv sync --frozen --quiet
          uv pip install --quiet --reinstall dist/nexus_windows_claude-*.whl
          uv run --frozen --no-sync pytest -q --noconftest tests/test_startup.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nexus-windows-claude/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1

  registry:
    # After the version reaches PyPI: server.json to the official MCP registry. mcp-publisher pinned by version and
    # SHA-256; no token stored, no manual login.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Wait until PyPI serves the version in server.json
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/nexus-windows-claude/$version/json" >/dev/null && exit 0
            sleep 20
          done
          echo "nexus-windows-claude $version is not on PyPI"; exit 1
      - name: Install mcp-publisher (pinned, checksum verified)
        shell: bash
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --strict -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
      # Former registry name, before the family naming: every version marked deprecated, pointing to the new one.
      - run: >-
          ./mcp-publisher status --status deprecated --all-versions --yes
          --message "Renamed to io.github.pironjulien/nexus-windows-claude (PyPI: nexus-windows-claude)"
          io.github.pironjulien/nexus-windows
