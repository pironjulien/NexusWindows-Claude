[project]
name = "nexus-windows"
version = "0.7.0"
description = "Background Windows desktop control for Claude: an MCP server that sees and acts without taking the user's mouse, keyboard or foreground"
authors = [
    { name = "Julien Piron", email = "contact@julienpiron.com" }
]
requires-python = ">=3.14"
dependencies = [
    "comtypes>=1.4.17",
    "mcp>=2.3.0",
    "pillow>=12.3.0",
    "websockets>=17.2",
    "windows-capture>=2.0.1",
]

[project.scripts]
claude-windows-computer-use = "nexus_windows.server:main"
nexus-windows = "nexus_windows.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
# Ruff cache kept outside the repository: nothing generated in the source tree.
cache-dir = "~/.claude/nexus-claude/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests sur de vraies fenêtres (labo), lents"]
addopts = "-m 'not live' -p no:cacheprovider"
